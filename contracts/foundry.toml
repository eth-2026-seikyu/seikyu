[profile.default]
src = "src"
out = "out"
libs = ["lib"]
auto_detect_remappings = false
solc = "0.8.27"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [
  { access = "read-write", path = "./deployments" },
  { access = "read", path = "./lib/contracts-v2/contracts/deployments/sepolia" },
]

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
